<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/my-image.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Your Name</title>
    <meta name="title" content="Your Name">
    <meta name="description" content="Your short bio or tagline goes here.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/">
    <meta property="og:title" content="Your Name">
    <meta property="og:description" content="Your short bio or tagline goes here.">
    <meta property="og:image" content="/my-image.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627"/>

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://example.com/">
    <meta property="twitter:title" content="Your Name">
    <meta property="twitter:description" content="Your short bio or tagline goes here.">
    <meta property="twitter:image" content="/my-image.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
